<style>
  :root {

    --cp-border: #dedede; --cp-border-strong: #919191; --cp-text: #242424; --cp-text-muted: #5c5c5c;
    --cp-text-soft: #6f6f6f; --cp-accent: #b11f4b; --cp-accent-hover: #9a1a41; --cp-accent-soft: rgba(177,31,75,0.08);
    --cp-accent-fg: #ffffff; --cp-success: #16a34a; --cp-danger: #dc2626; --cp-warning: #f59e0b; --cp-link: #0078d4;
    --cp-shadow: 0 18px 48px rgba(0,0,0,0.12);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --cp-bg: #3d3b3a; --cp-bg-elevated: #343231; --cp-surface: #292929; --cp-surface-soft: #2e2e2e;
    --cp-border: #474747; --cp-border-strong: #5f5f5f; --cp-text: #dedede; --cp-text-muted: #919191;
    --cp-text-soft: #b0b0b0; --cp-accent: #fd8ea1; --cp-accent-hover: #fb7b91; --cp-accent-soft: rgba(253,142,161,0.14);
    --cp-accent-fg: #1a1a1a; --cp-success: #4ade80; --cp-danger: #f87171; --cp-warning: #fbbf24; --cp-link: #4da6ff;
    --cp-shadow: 0 18px 48px rgba(0,0,0,0.32);
  }
  :root{
    --ink:#0b0b0c; --gray:#8a8a8e; --hair:#ececec; --sheet-radius:30px; --card-radius:18px; --gold:#f0a92a;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#0b0b0c}
  body{font-family:var(--font);color:#fff;touch-action:manipulation}
  #gl{position:fixed;inset:0;width:100vw;height:100dvh;display:block;z-index:0;touch-action:none}

  /* ---- floating scene tag ---- */
  #sceneTag{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:30;background:rgba(15,15,18,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.14);padding:9px 18px;border-radius:24px;text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,1.3,.4,1),opacity .3s;pointer-events:none;min-width:120px}
  #sceneTag .nm{font-weight:800;font-size:17px;letter-spacing:.2px}
  #sceneTag .vibe{font-size:11.5px;opacity:.72;margin-top:1px;font-weight:600;letter-spacing:.3px}
  #sceneTag.pulse{transform:translateX(-50%) scale(1.12)}

  /* ---- sound toggle ---- */
  #soundBtn{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;z-index:40;width:46px;height:46px;border:none;cursor:pointer;
    border-radius:50%;background:rgba(15,15,18,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.14);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 30px rgba(0,0,0,.25)}
  #soundBtn.off{opacity:.55}
  #hintTap{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 82px);transform:translateX(-50%);
    z-index:35;font-size:12.5px;color:rgba(255,255,255,.8);background:rgba(15,15,18,.4);backdrop-filter:blur(10px);
    padding:6px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.12);transition:opacity .5s;pointer-events:none}

  /* ---- bottom dock ---- */
  .dock{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;gap:14px;align-items:center;z-index:40}
  .tbtn{border:none;cursor:pointer;font-family:var(--font);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 26px rgba(0,0,0,.32);transition:transform .12s}
  .tbtn:active{transform:scale(.93)}
  .tbtn.round{width:56px;height:56px;border-radius:50%;background:rgba(24,24,27,.62);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);font-size:24px}
  .tbtn.wide{height:56px;padding:0 26px;border-radius:30px;background:#111214;font-size:19px;font-weight:800;gap:10px;
    border:1px solid rgba(255,255,255,.10)}
  .tbtn.wide .cardico{font-size:22px}

  /* ---- reaction pill & popover ---- */
  .react-pop{position:fixed;left:16px;bottom:96px;z-index:60;display:flex;gap:6px;padding:10px 12px;background:rgba(28,28,30,.92);
    backdrop-filter:blur(20px);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.4);transform:translateY(10px) scale(.9);
    opacity:0;pointer-events:none;transition:.18s}
  .react-pop.show{opacity:1;transform:none;pointer-events:auto}
  .react-pop button{border:none;background:none;font-size:26px;cursor:pointer;padding:2px;border-radius:10px;transition:transform .1s}
  .react-pop button:active{transform:scale(1.3)}

  /* ---- toast ---- */
  .toast{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 86px);transform:translateX(-50%) translateY(12px);
    z-index:70;background:rgba(20,20,22,.92);color:#fff;padding:11px 20px;border-radius:22px;font-size:14.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:.28s;box-shadow:0 10px 34px rgba(0,0,0,.4);max-width:80vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}

  /* ---- cards bottom sheet ---- */
  .scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(2px)}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(100%,540px);height:min(78%,680px);z-index:55;
    background:#fff;color:var(--ink);border-radius:var(--sheet-radius) var(--sheet-radius) 0 0;box-shadow:0 -12px 50px rgba(0,0,0,.35);
    transition:transform .34s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;overflow:hidden}
  html[data-theme="dark"] .sheet{background:#1b1b1d;color:#f2f2f2}
  .sheet.show{transform:translate(-50%,0)}
  .sheet-grab{width:38px;height:5px;border-radius:3px;background:#d9d9de;margin:9px auto 2px}
  html[data-theme="dark"] .sheet-grab{background:#48484c}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px}
  .sheet-head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px}
  .stat-pill{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--gray);font-weight:700}
  .stat-pill b{color:var(--ink)}
  html[data-theme="dark"] .stat-pill b{color:#fff}
  .closeX{border:none;background:#f0f0f2;width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;color:#333;display:flex;align-items:center;justify-content:center}
  html[data-theme="dark"] .closeX{background:#2c2c2f;color:#eee}
  .reaction-pill{display:inline-flex;align-items:center;gap:6px;background:#f0f0f2;border-radius:18px;padding:6px 12px;border:none;cursor:pointer;font-weight:700;font-size:14px;color:#333}
  html[data-theme="dark"] .reaction-pill{background:#2c2c2f;color:#eee}
  .sheet-scroll{overflow-y:auto;padding:4px 16px 30px;-webkit-overflow-scrolling:touch}
  .section-label{font-size:13px;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;margin:16px 4px 10px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{position:relative;cursor:pointer;border-radius:var(--card-radius);overflow:hidden;background:#f2f2f4;aspect-ratio:3/4;
    box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .12s}
  html[data-theme="dark"] .card{background:#252528}
  .card:active{transform:scale(.96)}
  .card.selected{outline:3px solid var(--gold);outline-offset:-3px}
  .card.trophy-sel{outline:3px solid var(--gold);outline-offset:-3px}
  .card .art{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .card .art img{width:86%;height:86%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
  .card .prop{position:absolute;font-size:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  .card .name{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 8px;font-size:13.5px;font-weight:800;color:#fff;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.5));text-align:center}
  .badge-ava{position:absolute;top:7px;left:7px;width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .badge-trophy{position:absolute;top:6px;right:6px;font-size:16px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .lock-overlay{position:absolute;inset:0;background:rgba(0,0,0,.34);backdrop-filter:blur(1px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .lock-overlay .lk{width:26px;height:26px}
  .lock-overlay .price{background:var(--gold);color:#4a2c00;font-weight:900;font-size:13px;padding:3px 10px;border-radius:12px}

  /* ---- settings ---- */
  #settings{position:fixed;inset:0;z-index:80;background:#f2f2f6;color:var(--ink);transform:translateX(100%);
    transition:transform .32s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;overflow:hidden}
  html[data-theme="dark"] #settings{background:#151517;color:#f0f0f0}
  #settings.show{transform:none}
  .set-nav{display:flex;align-items:center;gap:8px;padding:max(14px,env(safe-area-inset-top)) 16px 12px;font-weight:800;font-size:18px}
  .set-nav button{border:none;background:none;color:var(--cp-link);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:3px;padding:6px 4px}
  .set-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 20px}
  .set-hero .ava{width:88px;height:88px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .set-hero .nm{font-size:22px;font-weight:800}
  .set-hero .sub{font-size:13.5px;color:var(--gray)}
  .set-list{overflow-y:auto;padding:0 16px 40px;-webkit-overflow-scrolling:touch}
  .set-group{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  html[data-theme="dark"] .set-group{background:#232326}
  .item{display:flex;align-items:center;gap:13px;width:100%;border:none;background:none;padding:14px 16px;cursor:pointer;font-size:16px;color:inherit;text-align:left;font-family:var(--font)}
  .item.hair{border-top:1px solid #ececec}
  html[data-theme="dark"] .item.hair{border-top:1px solid #303033}
  .item .emo{font-size:20px;width:26px;text-align:center}
  .item .lbl{flex:1;font-weight:600}
  .item .val{color:var(--gray);font-size:15px}
  .item .chev{color:#c4c4c8;display:flex}
  .toggle{width:50px;height:30px;border-radius:16px;background:#d7d7dc;position:relative;transition:background .2s;flex:none}
  .toggle.on{background:var(--cp-success)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
  .toggle.on .knob{transform:translateX(20px)}

  /* ---- purchase dialog ---- */
  .dlg-scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
  .dlg-scrim.show{opacity:1;pointer-events:auto}
  .dlg{width:min(100%,340px);background:#fff;color:var(--ink);border-radius:26px;padding:22px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.92);transition:transform .25s}
  html[data-theme="dark"] .dlg{background:#202023;color:#f0f0f0}
  .dlg-scrim.show .dlg{transform:none}
  .dlg-preview{width:120px;height:150px;border-radius:16px;margin:0 auto 16px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .dlg-preview img{width:88%;height:88%;object-fit:contain;object-position:bottom}
  .dlg h3{margin:0 0 6px;font-size:21px;font-weight:800}
  .dlg p{margin:0 0 18px;font-size:14.5px;color:var(--gray);line-height:1.5}
  .dlg-btns{display:flex;flex-direction:column;gap:10px}
  .dlg-btns button{border:none;border-radius:15px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:var(--font)}
  .dlg-buy{background:var(--gold);color:#4a2c00}
  .dlg-cancel{background:#f0f0f2;color:#333}
  html[data-theme="dark"] .dlg-cancel{background:#2c2c2f;color:#eee}
</style>
</head>

  <div id="settings">

function spawnParticle(k){
  const cfg=KIND[k]; const p=parts.find(q=>q.life<=0); if(!p)return;
  const a=cfg.area(),v=cfg.vel(),c=COL(cfg.cols[(Math.random()*cfg.cols.length)|0]);
  p.x=a[0];p.y=a[1];p.z=a[2];p.vx=v[0];p.vy=v[1];p.vz=v[2];
  p.size=rand(cfg.size[0],cfg.size[1]);p.life=rand(cfg.life[0],cfg.life[1]);p.max=p.life;
  p.r=c[0];p.g=c[1];p.b=c[2];p.tw=cfg.tw;p.twp=Math.random()*TAU;p.drag=cfg.drag;p.g_=cfg.g;p.alpha=cfg.alpha||1;
}
function updateParticles(dt,time){
  const cfg=KIND[emitKind]; emitAcc+=cfg.rate*dt;
  while(emitAcc>=1){emitAcc-=1;spawnParticle(emitKind);}
  for(let i=0;i<PMAX;i++){const p=parts[i];const o=i*3;
    if(p.life<=0){pSize[i]=0;pPos[o+1]=-999;continue;}
    p.life-=dt;p.vy+=p.g_*dt;p.vx*=p.drag;p.vz*=p.drag;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    let a=clamp(p.life/(p.max*0.5),0,1)*(p.alpha||1);
    if(p.tw>0)a*=0.55+0.45*Math.sin(time*p.tw+p.twp);
    pPos[o]=p.x;pPos[o+1]=p.y;pPos[o+2]=p.z;
    pCol[o]=p.r*a;pCol[o+1]=p.g*a;pCol[o+2]=p.b*a;
    pSize[i]=p.size;
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.acolor.needsUpdate=true;
  pGeo.attributes.asize.needsUpdate=true;
}

/* ================= AUDIO ENGINE ================= */
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let actx=null,master=null,comp=null,soundOn=true,audioStarted=false;
let noiseBuffer=null, schedTimer=null, nextTime=0, step=0, ambience=null;
function makeNoise(){const b=actx.createBuffer(1,actx.sampleRate*1,actx.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function ensureAudio(){
  if(actx)return;
  actx=new AudioCtx(); noiseBuffer=makeNoise();
  comp=actx.createDynamicsCompressor(); comp.threshold.value=-18;comp.ratio.value=3;comp.attack.value=.004;comp.release.value=.25;
  master=actx.createGain(); master.gain.value=0.0001; master.connect(comp); comp.connect(actx.destination);
}
function tone(t,freq,dur,o={}){
  const {type='sine',gain=0.2,glideTo=null,detune=0,dest=master,attack=0.006,release=0.08,filter=null}=o;
  const osc=actx.createOscillator();osc.type=type;osc.frequency.setValueAtTime(freq,t);
  if(glideTo)osc.frequency.exponentialRampToValueAtTime(glideTo,t+dur);osc.detune.value=detune;
  const g=actx.createGain();const hold=Math.max(attack,dur-release);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+attack);
  g.gain.setValueAtTime(gain,t+hold);g.gain.linearRampToValueAtTime(0,t+dur);
  if(filter){const f=actx.createBiquadFilter();f.type=filter.type||'lowpass';f.frequency.value=filter.freq||900;f.Q.value=filter.Q||1;osc.connect(f);f.connect(g);}
  else osc.connect(g);
  g.connect(dest);osc.start(t);osc.stop(t+dur+0.05);
}
function noise(t,dur,o={}){
  const {gain=0.2,type='highpass',freq=2000,Q=1,dest=master,attack=0.001}=o;
  const s=actx.createBufferSource();s.buffer=noiseBuffer;
  const f=actx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=Q;
  const g=actx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+attack);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+dur+0.02);
}
const kick=(t,g=0.9)=>{const o=actx.createOscillator(),ga=actx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);ga.gain.setValueAtTime(g,t);ga.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.connect(ga);ga.connect(master);o.start(t);o.stop(t+0.24);};
const snare=(t,g=0.5)=>{noise(t,0.2,{gain:g*0.7,type:'highpass',freq:1700});tone(t,180,0.18,{type:'triangle',gain:g*0.4,release:0.12});};
const hat=(t,g=0.3,open=false)=>noise(t,open?0.12:0.045,{gain:g,type:'highpass',freq:8500});
const clap=(t,g=0.5)=>[0,0.011,0.022].forEach(o=>noise(t+o,0.11,{gain:g*0.55,type:'bandpass',freq:1500,Q:0.8}));
const bell=(t,f,dur=0.5,g=0.18)=>{tone(t,f,dur,{type:'sine',gain:g,release:dur*0.6});tone(t,f*2.01,dur*0.7,{type:'sine',gain:g*0.4,release:dur*0.5});};
const pad=(t,fs,dur,g=0.07)=>fs.forEach(f=>tone(t,f,dur,{type:'sawtooth',gain:g,attack:dur*0.25,release:dur*0.45,filter:{type:'lowpass',freq:1100,Q:0.5}}));
const bass=(t,f,dur,g=0.5)=>tone(t,f,dur,{type:'sawtooth',gain:g,attack:0.005,release:0.06,filter:{type:'lowpass',freq:420,Q:1.2}});
const pluck=(t,f,dur,g=0.24)=>tone(t,f,dur,{type:'triangle',gain:g,release:dur*0.7,filter:{type:'lowpass',freq:2800}});
const lead=(t,f,dur,g=0.2)=>tone(t,f,dur,{type:'sawtooth',gain:g,release:dur*0.5,filter:{type:'lowpass',freq:2400,Q:3}});
function laugh(t,g=0.5){const n=4+((Math.random()*3)|0);let base=520+Math.random()*70;
  for(let i=0;i<n;i++){const tt=t+i*0.13,f=base*(1-i*0.055);
    tone(tt,f,0.11,{type:'sawtooth',gain:g*0.5,attack:0.01,release:0.06,filter:{type:'bandpass',freq:950,Q:6}});
    tone(tt,f*1.5,0.09,{type:'sine',gain:g*0.14,attack:0.01,release:0.05});}}
function giggle(){ if(!actx||!soundOn)return; laugh(actx.currentTime+0.02,0.6); }

function setAmbience(id){
  if(ambience){try{ambience.stop();}catch(e){}ambience=null;}
  if(!actx)return;
  const mk=(freq,Q,gain,type='lowpass')=>{const s=actx.createBufferSource();s.buffer=noiseBuffer;s.loop=true;
    const f=actx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=Q;
    const g=actx.createGain();g.gain.value=gain;s.connect(f);f.connect(g);g.connect(master);s.start();return s;};
  if(id==='solace')ambience=mk(1600,0.7,0.09,'bandpass');
  else if(id==='voyage')ambience=mk(300,0.5,0.05,'lowpass');
  else if(id==='shhh')ambience=mk(1000,0.6,0.045,'bandpass');
  else if(id==='wander')ambience=mk(500,0.4,0.04,'lowpass');
  else if(id==='burden')ambience=mk(120,2,0.06,'lowpass');
  else if(id==='citylights')ambience=mk(180,1.2,0.05,'lowpass');
}
function playStep(id,st,t){
  const bar=st%16, phrase=Math.floor(st/16);
  switch(id){
    case 'glimpse':
      if(bar===0)pad(t,[midi(48),midi(52),midi(55)],2.0,0.05);
      if(bar%4===0)bell(t,midi([72,76,79,84][(bar/4)|0]),0.6,0.12);
      if(bar%4===0)kick(t,0.4); if(bar%4===2)hat(t,0.12); break;
    case 'shhh':
      if(st%32===0)pad(t,[midi(57),midi(60),midi(64)],3.2,0.05);
      if(bar===8)noise(t,0.5,{gain:0.14,type:'bandpass',freq:3800,Q:0.7});
      if(bar===4||bar===12)noise(t,0.06,{gain:0.18,type:'highpass',freq:6000});
      if(st%16===2&&phrase%2===1)bell(t,midi(72),0.5,0.06); break;
    case 'devotion':
      if(bar===0)pad(t,[midi(53),midi(57),midi(60)],2.0,0.07);
      if(bar===0||bar===2)kick(t,0.42);
      if(bar%4===0)pluck(t,midi([65,69,72,77][(bar/4)|0]),0.5,0.2);
      if(st%32===24)bell(t,midi(81),0.6,0.1); break;
    case 'burden':
      if(bar===0){bass(t,midi(36),1.9,0.5);pad(t,[midi(48),midi(51),midi(55)],1.9,0.06);}
      if(bar===0||bar===8){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(45,t+0.3);g.gain.setValueAtTime(0.6,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.42);}
      break;
    case 'hatching':{
      const mel=[60,64,67,72,67,64,67,71];
      if(st%2===0)pluck(t,midi(mel[(st/2)%mel.length]),0.22,0.24);
      if(bar%4===0)kick(t,0.6); if(bar===4||bar===12)clap(t,0.4);
      if(bar===0)bell(t,midi(84),0.5,0.14);
      if(st===0)[76,79,83,88].forEach((n,i)=>bell(t+i*0.09,midi(n),0.4,0.12)); break;}
    case 'smile':{
      if(bar%4===0)kick(t,0.95); if(bar===4||bar===12)clap(t,0.55);
      if(bar%2===1)hat(t,0.28,bar%8===7); if(bar%4===2)bass(t,midi(43),0.22,0.5);
      const stab=[67,71,74];if(bar===0||bar===6||bar===10)stab.forEach(n=>lead(t,midi(n),0.2,0.14));
      const mel=[79,0,76,74,0,71,74,76];if(st%2===0&&mel[(st/2)%8])pluck(t,midi(mel[(st/2)%8]),0.2,0.2);
      if(st%32===0)laugh(t+0.05,0.5); break;}
    case 'voyage':{
      if(st%2===1)hat(t,0.18); if(bar%4===0)kick(t,0.5);
      if(bar===0)pad(t,[midi(50),midi(54),midi(57)],2.0,0.06);
      const mel=[62,66,69,74,69,66];if(bar%2===0)pluck(t,midi(mel[(bar/2)%mel.length]),0.4,0.22);
      if(bar===8)clap(t,0.3); break;}
    case 'solace':{
      if(st%32===0)pad(t,[midi(50),midi(53),midi(57),midi(60),midi(64)],4.2,0.06);
      const notes=[74,77,81,72];if(st%16===6||st%16===11)bell(t,midi(notes[phrase%4]),0.9,0.07);
      if(st%64===0)tone(t,midi(38),2.5,{type:'sine',gain:0.18,release:1.5}); break;}
    case 'citylights':{
      if(bar%4===0)kick(t,0.92);
      if(bar%2===1)hat(t,0.3,bar%8===7);
      if(bar===4||bar===12)clap(t,0.45);
      const bl=[45,45,41,43];if(bar%4===2)bass(t,midi(bl[phrase%4]),0.22,0.55);
      const arp=[69,72,76,81,76,72];if(st%2===0)lead(t,midi(arp[(st/2)%arp.length]),0.2,0.16);
      break;}
    case 'wander':{
      const mel=[67,69,71,74,71,69,67,71];
      if(st%2===0)tone(t,midi(mel[(st/2)%mel.length]),0.34,{type:'sine',gain:0.16,attack:0.03,release:0.2,detune:Math.sin(st)*6});
      if(bar%4===0)pluck(t,midi(55),0.4,0.16);
      if(bar%4===0){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(70,t+0.15);g.gain.setValueAtTime(0.35,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.22);}
      if(bar%2===1)hat(t,0.14); break;}
  }
}
function scheduler(){
  if(!actx)return;
  const bpm=SCENES[curScene].bpm, stepDur=(60/bpm)/4;
  while(nextTime<actx.currentTime+0.12){
    if(soundOn)playStep(curScene,step,nextTime);
    nextTime+=stepDur; step=(step+1)%64;
  }
}
function startAudio(){
  if(audioStarted)return; ensureAudio();
  if(actx.state==='suspended')actx.resume();
  audioStarted=true; nextTime=actx.currentTime+0.06; step=0;
  setAmbience(curScene);
  schedTimer=setInterval(scheduler,25);
  master.gain.cancelScheduledValues(actx.currentTime);
  master.gain.setTargetAtTime(soundOn?0.16:0.0001,actx.currentTime,0.3);
}
function setSoundOn(on){
  soundOn=on;
  const b=document.getElementById('soundBtn'); b.textContent=on?'🔊':'🔇'; b.classList.toggle('off',!on);
  if(actx&&audioStarted)master.gain.setTargetAtTime(on?0.16:0.0001,actx.currentTime,0.25);
  if(on&&!audioStarted)startAudio();
  if(actx){ if(on)setAmbience(curScene); else setAmbience(null); }
}

/* ================= RENDER LOOP ================= */
let last=performance.now(), danceT=0, blinkTimer=rand(2,5), blink=1, blinkPhase=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; const time=now/1000;
  const k=2.2;
  for(const key2 of ['az','el','dist','orbit','keyI','hemi','exp','bloom','fog'])cur[key2]=damp(cur[key2],tgt[key2],k,dt);
  const lf=1-Math.exp(-k*dt);
  cKey.lerp(tKey,lf); cBg.lerp(tBg,lf); cGlow.lerp(tGlow,lf); cFog.lerp(tFog,lf);
  key.color.copy(cKey); key.intensity=cur.keyI; hemi.intensity=cur.hemi;
  renderer.toneMappingExposure=cur.exp; bloom.strength=cur.bloom;
  scene.background.copy(cBg); scene.fog.color.copy(cFog); scene.fog.density=cur.fog;
  glowMat.color.copy(cGlow);

  const az=(cur.az+Math.sin(time*cur.orbit)*7)*Math.PI/180, el=cur.el*Math.PI/180, D=cur.dist;
  camera.position.set(Math.sin(az)*Math.cos(el)*D, camTarget.y+Math.sin(el)*D, Math.cos(az)*Math.cos(el)*D);
  camera.lookAt(camTarget);

  danceT+=dt*(SCENES[curScene].bpm/60)*Math.PI;
  const T=DANCES[activeDance](danceT);
  danceBlend=Math.min(1,danceBlend+dt*2.2);
  const follow=lerp(0.12,0.34,danceBlend);
  for(const c in REST)pose[c]=lerp(pose[c],T[c],follow);
  blinkTimer-=dt;
  if(blinkTimer<=0){blinkPhase+=dt*14; if(blinkPhase>=Math.PI){blinkPhase=0;blinkTimer=rand(2.5,6);blink=1;}else blink=1-0.9*Math.sin(blinkPhase);}
  applyPose(pose,blink);

  updateParticles(dt,time);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

}

}

const REACTS=["😆","😍","👏","🔥","🥹","😮"]; let reactCount=15; const pop=$("#reactPop");
REACTS.forEach(r=>{const b=document.createElement('button');b.textContent=r;b.addEventListener('click',()=>{react(r);hideReactPop();});pop.appendChild(b);});
function openReactPop(){pop.classList.add('show');} function hideReactPop(){pop.classList.remove('show');}
$("#reactionPill").addEventListener('click',e=>{e.stopPropagation();pop.classList.contains('show')?hideReactPop():openReactPop();});
document.addEventListener('click',e=>{if(!pop.contains(e.target)&&e.target.id!=='reactionPill'&&!$("#reactionPill").contains(e.target))hideReactPop();});
function react(emoji){reactCount++;$("#reactCount").textContent=reactCount;$("#reactionPill").querySelector('.emo').textContent=emoji;giggle();flourish();}

$("#shuffleBtn").addEventListener('click',()=>{
  const owned=CARDS.filter(c=>c.owned&&c.id!==currentId);
  const pick=owned[(Math.random()*owned.length)|0]; if(!pick)return;
  applyScene(pick.id); renderCards();
  pose.ry+=(mirror?-1:1)*TAU;
  if(actx&&soundOn)tone(actx.currentTime,300,0.4,{type:'sawtooth',gain:0.2,glideTo:900,release:0.3});
  if(!$("#sheet").classList.contains('show'))toast("✨ "+pick.name);
});
function flourish(){ pose.y+=0.25; danceBlend=Math.min(danceBlend,0.5); }

let pendingBuy=null;
function openDialog(c){pendingBuy=c;$("#dlgTitle").textContent=c.name;$("#dlgText").textContent=`Unlock “${c.name}” to add this card to Reverie’s collection.`;$("#dlgBuy").textContent=`Buy $${c.price}`;$("#dlgPreview").style.background=`linear-gradient(180deg,${c.bg},${c.bg2})`;$("#dlgScrim").classList.add('show');}
$("#dlgCancel").addEventListener('click',()=>$("#dlgScrim").classList.remove('show'));
$("#dlgScrim").addEventListener('click',e=>{if(e.target.id==='dlgScrim')$("#dlgScrim").classList.remove('show');});
$("#dlgBuy").addEventListener('click',()=>{if(pendingBuy){pendingBuy.owned=true;applyScene(pendingBuy.id);renderCards();toast("Unlocked "+pendingBuy.name+" 🎉");}$("#dlgScrim").classList.remove('show');});

let toastT; function toast(m){const t=$("#toast");t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}

canvas.addEventListener('pointerdown',()=>{ giggle(); flourish(); react($("#reactionPill").querySelector('.emo').textContent); });

$("#soundBtn").addEventListener('click',()=>{setSoundOn(!soundOn);
  const t=setList.querySelector('.toggle[data-t="sound"]'); if(t)t.classList.toggle('on',soundOn);
});

let unlocked=false;
function unlock(){ if(unlocked)return; unlocked=true; startAudio();
  const h=$("#hintTap"); if(h){h.style.opacity='0';setTimeout(()=>h.remove(),600);} }
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));

renderCards();
applyScene("glimpse");
const q=new URLSearchParams(location.search);
if(q.get('card')){const c=cardById(q.get('card'));if(c&&c.owned){applyScene(c.id);renderCards();}}
if(q.get('view')==='cards')openSheet();
if(q.get('view')==='settings')$("#settings").classList.add('show');
</script>
</body>
</html>
