<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Naiwa — Reverie</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
    const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --cp-bg: #f7f4ef; --cp-bg-elevated: #fcfbf8; --cp-surface: #ffffff; --cp-surface-soft: #f5f5f5;
    --cp-border: #dedede; --cp-border-strong: #919191; --cp-text: #242424; --cp-text-muted: #5c5c5c;
    --cp-text-soft: #6f6f6f; --cp-accent: #b11f4b; --cp-accent-hover: #9a1a41; --cp-accent-soft: rgba(177,31,75,0.08);
    --cp-accent-fg: #ffffff; --cp-success: #16a34a; --cp-danger: #dc2626; --cp-warning: #f59e0b; --cp-link: #0078d4;
    --cp-shadow: 0 18px 48px rgba(0,0,0,0.12);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --cp-bg: #3d3b3a; --cp-bg-elevated: #343231; --cp-surface: #292929; --cp-surface-soft: #2e2e2e;
    --cp-border: #474747; --cp-border-strong: #5f5f5f; --cp-text: #dedede; --cp-text-muted: #919191;
    --cp-text-soft: #b0b0b0; --cp-accent: #fd8ea1; --cp-accent-hover: #fb7b91; --cp-accent-soft: rgba(253,142,161,0.14);
    --cp-accent-fg: #1a1a1a; --cp-success: #4ade80; --cp-danger: #f87171; --cp-warning: #fbbf24; --cp-link: #4da6ff;
    --cp-shadow: 0 18px 48px rgba(0,0,0,0.32);
  }

  /* ---- App palette (faithful to the source iOS app) ---- */
  :root {
    --ink: #0b0b0c;
    --ink-2: #1c1c1e;
    --gray: #8a8a8e;
    --gray-2: #aeaeb2;
    --hair: #ececec;
    --hair-2: #e2e2e4;
    --sheet-radius: 30px;
    --card-radius: 18px;
    --gold: #f0a92a;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--font);
    background:
      radial-gradient(1200px 700px at 50% -10%, #efefef 0%, #d7d7db 55%, #c9c9cf 100%);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 24px;
    overflow: hidden;
  }

  /* Phone frame */
  .phone {
    position: relative;
    width: 390px; height: 844px;
    max-height: calc(100dvh - 40px);
    aspect-ratio: 390 / 844;
    background: #000; border-radius: 54px;
    padding: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,.35), 0 30px 70px rgba(0,0,0,.45), inset 0 0 0 2px #2a2a2a;
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    background: #fff; border-radius: 49px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  @media (max-width: 440px), (max-height: 860px) {
    body { padding: 0; }
    .phone { width: 100dvw; height: 100dvh; max-height: none; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; }
  }

  /* Status bar */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px; font-weight: 600; font-size: 15px; color: #000; pointer-events: none;
  }
  .statusbar.on-dark { color: #fff; }
  .sb-left { display: flex; align-items: center; gap: 7px; letter-spacing: .2px; }
  .sb-left .bed { font-size: 13px; opacity:.9 }
  .sb-right { display: flex; align-items: center; gap: 7px; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 34px; background: #000; border-radius: 20px; z-index: 41;
    display:flex; align-items:center; justify-content:flex-end; padding-right:14px;
  }
  .island .cam { width: 8px; height: 8px; border-radius: 50%; background: #21252b; box-shadow: inset 0 0 0 2px #14161a; }
  .island .cam::after{ content:""; position:absolute; width:4px;height:4px;border-radius:50%; background:#e8863a; transform: translate(-2px,0); }
  .bars { display:flex; align-items:flex-end; gap:2px; height:12px; }
  .bars i { width:3px; background: currentColor; border-radius:1px; }
  .bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:12px; opacity:.35}
  .wifi { width:17px; height:13px; }
  .batt { display:flex; align-items:center; gap:3px; }
  .batt .shell { position:relative; width:26px; height:13px; border-radius:4px; border:1.4px solid currentColor; opacity:.9; padding:1.6px; }
  .batt .shell::after{ content:""; position:absolute; right:-3.5px; top:3.5px; width:2px; height:5px; border-radius:2px; background:currentColor; opacity:.5;}
  .batt .lvl { height:100%; width:26%; background:#f5c518; border-radius:2px; }
  .batt .num { font-size:11px; font-weight:700; }

  /* View system */
  .view { position:absolute; inset:0; display:flex; flex-direction:column; }

  /* ---------- MAIN ---------- */
  #main { background:#fff; transition: background .5s ease; }
  .stage {
    flex:1; position:relative; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .scene-emoji { position:absolute; z-index:2; filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); pointer-events:none; }
  .char-wrap {
    position:relative; height:66%; display:flex; align-items:flex-end; justify-content:center; z-index:3;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .char {
    height:100%; width:auto; user-select:none; -webkit-user-drag:none;
    filter: drop-shadow(0 26px 26px rgba(0,0,0,.18));
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    cursor:pointer;
  }
  .char.mirror { transform: scaleX(-1); }
  .char.bounce { animation: bounce .6s ease; }
  @keyframes bounce { 0%,100%{transform:translateY(0) scale(var(--mx,1),1)} 30%{transform:translateY(-14px) scale(var(--mx,1),1)} 60%{transform:translateY(4px) scale(var(--mx,1),1)} }

  .float-emoji { position:absolute; z-index:6; font-size:34px; pointer-events:none; animation: floatUp 1.1s ease forwards; }
  @keyframes floatUp { 0%{opacity:0; transform:translateY(10px) scale(.6)} 20%{opacity:1} 100%{opacity:0; transform:translateY(-120px) scale(1.2)} }

  /* Toolbar */
  .toolbar {
    position:absolute; left:0; right:0; bottom: 26px; z-index:20;
    display:flex; align-items:center; justify-content:center; gap:16px;
  }
  .tbtn {
    height:60px; background:#141414ee; color:#fff; border:none; border-radius:34px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    box-shadow: 0 10px 24px rgba(0,0,0,.28); cursor:pointer; backdrop-filter: blur(6px);
    font-family:var(--font); font-weight:700; font-size:19px; letter-spacing:.2px;
    transition: transform .12s ease, background .2s;
  }
  .tbtn.round { width:60px; }
  .tbtn.wide { padding:0 30px 0 16px; }
  .tbtn:active { transform: scale(.94); }
  .tbtn svg { width:26px; height:26px; }
  .card-icon {
    width:30px; height:40px; border-radius:5px; background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:15px; box-shadow: inset 0 0 0 1.5px #ddd;
    position:relative; color:#141414;
  }
  .card-icon .pip{ position:absolute; font-size:9px; font-weight:800; }
  .card-icon .pip.tl{ top:2px; left:3px } .card-icon .pip.br{ bottom:2px; right:3px; transform:rotate(180deg) }

  /* ---------- CARDS SHEET ---------- */
  .scrim { position:absolute; inset:0; background:rgba(0,0,0,.42); z-index:50; opacity:0; pointer-events:none; transition:opacity .3s ease; }
  .scrim.show { opacity:1; pointer-events:auto; }
  .sheet {
    position:absolute; left:0; right:0; bottom:0; z-index:60; height:74%;
    background:#fff; border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
    transform: translateY(102%); transition: transform .38s cubic-bezier(.32,.72,0,1);
    display:flex; flex-direction:column; box-shadow: 0 -14px 40px rgba(0,0,0,.18);
  }
  .sheet.show { transform: translateY(0); }
  .grabber { width:38px; height:5px; border-radius:3px; background:#e2e2e4; margin:9px auto 0; flex:none; }
  .sheet-head {
    display:flex; align-items:center; gap:12px; padding:12px 16px 12px; flex:none;
  }
  .reaction-pill {
    display:flex; align-items:center; gap:7px; background:#f2f2f4; border:none;
    padding:8px 13px; border-radius:20px; font-weight:800; font-size:16px; cursor:pointer; color:var(--ink);
    font-family:var(--font); transition: transform .12s;
  }
  .reaction-pill:active{ transform:scale(.95) }
  .reaction-pill .emo{ font-size:19px }
  .sheet-title { display:flex; align-items:center; gap:9px; flex:1; justify-content:center; }
  .sheet-title .ava { width:30px; height:30px; border-radius:50%; background:#f3d38a center/125% no-repeat; box-shadow: inset 0 0 0 2px #eab94e; }
  .sheet-title b { font-size:20px; font-weight:800; letter-spacing:.2px; }
  .sheet-title .days { color:var(--gray); font-weight:600; font-size:15px; }
  .xbtn {
    width:34px; height:34px; border-radius:50%; background:#ededed; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#8a8a8e; flex:none;
  }
  .xbtn:active{ transform:scale(.92) }
  .xbtn svg{ width:15px; height:15px }

  .sheet-scroll { overflow-y:auto; padding: 4px 0 30px; -webkit-overflow-scrolling:touch; }
  .section-label { font-size:16px; font-weight:800; color:#9a9a9f; padding:14px 18px 10px; letter-spacing:.2px; }
  .row {
    display:flex; gap:14px; overflow-x:auto; padding: 2px 18px 8px; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
  }
  .row::-webkit-scrollbar{ display:none } .row{ scrollbar-width:none }
  .card {
    position:relative; flex:none; width:150px; height:200px; border-radius: var(--card-radius);
    overflow:hidden; cursor:pointer; scroll-snap-align:start; background:#f0f0f2;
    box-shadow: 0 1px 3px rgba(0,0,0,.14); transition: transform .14s ease;
    outline: 3px solid transparent; outline-offset: -3px;
  }
  .card:active{ transform:scale(.97) }
  .card.selected::after, .card.trophy-sel::after {
    content:""; position:absolute; inset:0; border-radius:inherit;
    border:3px solid #111; z-index:6; pointer-events:none;
  }
  .card.trophy-sel::after { border-color: var(--gold); }
  .card .art { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; }
  .card .art img { height:82%; width:auto; filter: drop-shadow(0 10px 10px rgba(0,0,0,.22)); }
  .card .art .prop { position:absolute; font-size:26px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
  .card .name {
    position:absolute; left:0; right:0; bottom:0; height:44px; background:#111;
    color:#fff; font-weight:800; font-size:17px; display:flex; align-items:center; justify-content:center; letter-spacing:.2px;
  }
  .badge-ava {
    position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background:#f3d38a center/135% no-repeat; box-shadow: inset 0 0 0 2px #eab94e, 0 1px 3px rgba(0,0,0,.3); z-index:4;
  }
  .badge-trophy { position:absolute; top:6px; left:8px; font-size:22px; z-index:4; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .lock-overlay {
    position:absolute; inset:0; background: rgba(0,0,0,.28); z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:#fff;
    backdrop-filter: blur(1px);
  }
  .lock-overlay .lk { width:34px; height:34px; }
  .lock-overlay .price { font-weight:800; font-size:20px; text-shadow:0 1px 4px rgba(0,0,0,.5); }

  /* ---------- SETTINGS ---------- */
  #settings { background:#fff; transform: translateX(100%); transition: transform .34s cubic-bezier(.32,.72,0,1); z-index:70; overflow-y:auto; overflow-x:hidden; width:100%; }
  #settings.show { transform: translateX(0); }
  .nav {
    position:sticky; top:0; height:54px; display:flex; align-items:center; justify-content:center;
    padding-top:44px; padding-bottom:8px; background:#fff; z-index:5;
  }
  .nav h1 { font-size:19px; font-weight:800; margin:0; }
  .nav .back {
    position:absolute; left:14px; top:46px; width:44px; height:44px; border-radius:50%;
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.12); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#111;
  }
  .nav .back:active{ transform:scale(.93) }
  .set-hero { display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px 0 4px; }
  .set-hero .ava {
    width:92px; height:92px; border-radius:50%; background:#f3d38a center/128% no-repeat;
    box-shadow: inset 0 0 0 5px #eab94e; 
  }
  .set-hero .who { display:flex; align-items:baseline; gap:8px; }
  .set-hero .who b { font-size:22px; font-weight:800; }
  .set-hero .who span { color:var(--gray); font-weight:600; font-size:16px; }
  .stats { display:flex; align-items:center; justify-content:center; gap:0; padding:14px 0 8px; }
  .stat { flex:1; text-align:center; }
  .stat b { display:block; font-size:40px; font-weight:800; letter-spacing:.5px; line-height:1.05; }
  .stat span { color:var(--gray); font-weight:600; font-size:16px; }
  .stat-div { width:1px; height:52px; background:var(--hair-2); }
  .list { padding: 6px 0 40px; }
  .item {
    display:flex; align-items:center; gap:14px; padding:15px 20px; cursor:pointer; background:#fff; border:none; width:100%;
    font-family:var(--font); text-align:left; color:var(--ink); position:relative;
  }
  .item:active{ background:#f6f6f6 }
  .item .emo{ font-size:23px; width:28px; text-align:center; flex:none; }
  .item .lbl{ flex:1; font-size:19px; font-weight:600; }
  .item .val{ color:var(--gray); font-weight:600; font-size:17px; }
  .item .chev{ color:#c4c4c9; }
  .item.hair { border-top:1px solid var(--hair); }
  .toggle {
    width:52px; height:31px; border-radius:20px; background:#e6e6e9; position:relative; transition:background .2s; flex:none;
  }
  .toggle.on{ background:#34c759 }
  .toggle .knob{ position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.25); transition:left .2s; }
  .toggle.on .knob{ left:23px }

  /* reaction popover */
  .react-pop {
    position:absolute; z-index:80; bottom:78px; left:16px; background:#fff; border-radius:26px;
    box-shadow: 0 10px 30px rgba(0,0,0,.22); padding:8px 12px; display:flex; gap:6px;
    transform: scale(.6); opacity:0; transform-origin: bottom left; pointer-events:none; transition: all .18s cubic-bezier(.34,1.56,.64,1);
  }
  .react-pop.show{ transform:scale(1); opacity:1; pointer-events:auto; }
  .react-pop button{ background:none; border:none; font-size:28px; cursor:pointer; padding:4px; border-radius:50%; transition:transform .12s; }
  .react-pop button:hover{ transform:scale(1.25) }

  /* toast */
  .toast {
    position:absolute; z-index:90; left:50%; bottom:120px; transform:translate(-50%,20px);
    background:#111; color:#fff; padding:12px 18px; border-radius:16px; font-weight:700; font-size:15px;
    opacity:0; pointer-events:none; transition: all .25s ease; box-shadow:0 8px 24px rgba(0,0,0,.3); text-align:center; max-width:80%;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0) }

  /* purchase dialog */
  .dlg-scrim{ position:absolute; inset:0; z-index:100; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; }
  .dlg-scrim.show{ opacity:1; pointer-events:auto; }
  .dlg{ width:270px; background:#f4f4f6; border-radius:20px; overflow:hidden; text-align:center; transform:scale(.9); transition:transform .2s; }
  .dlg-scrim.show .dlg{ transform:scale(1) }
  .dlg .body{ padding:20px 18px 16px; }
  .dlg .body h3{ margin:0 0 6px; font-size:18px; font-weight:800; }
  .dlg .body p{ margin:0; font-size:14px; color:#6b6b70; line-height:1.4; }
  .dlg .preview{ width:96px; height:128px; border-radius:12px; margin:14px auto 0; overflow:hidden; position:relative; box-shadow:0 4px 12px rgba(0,0,0,.2); }
  .dlg .preview img{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); height:80% }
  .dlg .acts{ display:flex; border-top:1px solid #dcdce0; }
  .dlg .acts button{ flex:1; padding:14px; background:none; border:none; font-family:var(--font); font-size:17px; cursor:pointer; color:#0a84ff; }
  .dlg .acts button.buy{ font-weight:800; border-left:1px solid #dcdce0; }
  .dlg .acts button:active{ background:#e9e9ee }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <!-- Dynamic Island -->
      <div class="island"><span class="cam"></span></div>

      <!-- Status bar -->
      <div class="statusbar" id="statusbar">
        <div class="sb-left"><span id="clock">9:38</span> <span class="bed">🛏️</span></div>
        <div class="sb-right">
          <span class="bars"><i></i><i></i><i></i><i></i></span>
          <svg class="wifi" viewBox="0 0 16 12" fill="none"><path d="M8 11.2a1.15 1.15 0 100-2.3 1.15 1.15 0 000 2.3z" fill="currentColor"/><path d="M3.7 6.9a6 6 0 018.6 0M1.4 4.6a9.2 9.2 0 0113.2 0M5.9 9.1a3 3 0 014.2 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span class="batt"><span class="num">19</span><span class="shell"><span class="lvl"></span></span></span>
        </div>
      </div>

      <!-- ===== MAIN VIEW ===== -->
      <div class="view" id="main">
        <div class="stage" id="stage">
          <div class="char-wrap" id="charWrap">
            <img src="reverie.png" class="char" id="char" alt="Reverie" draggable="false" />
          </div>
        </div>
        <div class="toolbar">
          <button class="tbtn round" id="shuffleBtn" title="Shuffle">
            <span style="font-size:26px; line-height:1">♻️</span>
          </button>
          <button class="tbtn wide" id="cardsBtn">
            <span class="card-icon"><span class="pip tl">J</span>🃏<span class="pip br">J</span></span>
            Cards
          </button>
          <button class="tbtn round" id="settingsBtn" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="#cfcfcf" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1.08 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </button>
        </div>

        <!-- reaction popover -->
        <div class="react-pop" id="reactPop"></div>
        <div class="toast" id="toast"></div>
      </div>

      <!-- ===== CARDS SHEET ===== -->
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet">
        <div class="grabber"></div>
        <div class="sheet-head">
          <button class="reaction-pill" id="reactionPill"><span class="emo">😆</span><span id="reactCount">15</span></button>
          <div class="sheet-title">
            <span class="ava" id="headAva"></span>
            <b>Reverie</b><span class="days">· 14 days left</span>
          </div>
          <button class="xbtn" id="closeSheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="sheet-scroll" id="sheetScroll"><!-- sections injected --></div>
      </div>

      <!-- ===== SETTINGS ===== -->
      <div class="view" id="settings">
        <div class="nav">
          <button class="back" id="backBtn"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
          <h1>Settings</h1>
        </div>
        <div class="set-hero">
          <div class="ava" id="setAva"></div>
          <div class="who"><b>Reverie</b><span>· 14 days left</span></div>
        </div>
        <div class="stats">
          <div class="stat"><b id="statCards">8/10</b><span>Cards</span></div>
          <div class="stat-div"></div>
          <div class="stat"><b>1/1</b><span>Keepsakes</span></div>
        </div>
        <div class="list" id="setList"></div>
      </div>

      <!-- purchase dialog -->
      <div class="dlg-scrim" id="dlgScrim">
        <div class="dlg">
          <div class="body">
            <div class="preview" id="dlgPreview"><img src="reverie.png" alt=""></div>
            <h3 id="dlgTitle">Unlock Card</h3>
            <p id="dlgText">Unlock this card to add it to your collection.</p>
          </div>
          <div class="acts">
            <button id="dlgCancel">Cancel</button>
            <button class="buy" id="dlgBuy">Buy $0.99</button>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
(() => {
  const CHAR = "reverie.png";
  // Card catalog — faithful structure to the source app
  const CARDS = [
    // Action
    { id:"glimpse",  name:"Glimpse",  section:"Action", owned:true,  bg:"#ffffff", bg2:"#f4f4f6", prop:"", propPos:"" , selected:true},
    { id:"shhh",     name:"Shhh",     section:"Action", owned:true,  bg:"#fbfbfd", bg2:"#eef0f3", prop:"🤫", propPos:"top:26%;right:26%"},
    { id:"devotion", name:"Devotion", section:"Action", owned:true,  bg:"#eaf3fb", bg2:"#d3e6f7", prop:"😇", propPos:"top:6%;left:50%;transform:translateX(-50%)"},
    // Scene
    { id:"burden",   name:"Burden",   section:"Scene",  owned:true,  bg:"#1f6fb2", bg2:"#0f4f86", prop:"🚪", propPos:"top:20%;right:12%", dark:true},
    { id:"hatching", name:"Hatching", section:"Scene",  owned:true,  bg:"#c9821f", bg2:"#e7b34e", prop:"🥚", propPos:"bottom:14%;left:50%;transform:translateX(-50%)", trophy:true, dark:true},
    { id:"smile",    name:"Smile",    section:"Scene",  owned:false, price:"0.99", bg:"#48597e", bg2:"#33425f", prop:"🚓", propPos:"top:24%;left:14%", dark:true},
    { id:"voyage",   name:"Voyage",   section:"Scene",  owned:false, price:"1.99", bg:"#0f8a94", bg2:"#0a6d75", prop:"⛵", propPos:"top:18%;right:16%", dark:true},
    // Companion
    { id:"solace",   name:"Solace",   section:"Companion", owned:true, bg:"#4b5a76", bg2:"#33415c", prop:"🌧️", propPos:"top:8%;left:50%;transform:translateX(-50%)", dark:true},
    { id:"citylights",name:"City Lights",section:"Companion", owned:true, bg:"#232a4a", bg2:"#141834", prop:"🌃", propPos:"top:12%;right:12%", dark:true},
    { id:"wander",   name:"Wander",   section:"Companion", owned:true, bg:"#5c6f63", bg2:"#42544a", prop:"🍃", propPos:"top:16%;left:14%", dark:true},
  ];

  const FACE = "reverie_face.png";
  // set avatar backgrounds
  ["headAva","setAva"].forEach(id=>{ document.getElementById(id).style.backgroundImage = `url(${FACE})`; });

  const $ = s => document.querySelector(s);
  const stage = $("#stage"), charEl = $("#char"), charWrap = $("#charWrap");
  let currentId = "glimpse";
  let mirror = false;

  function cardById(id){ return CARDS.find(c=>c.id===id); }

  function applyScene(id){
    const c = cardById(id); if(!c) return;
    currentId = id;
    $("#main").style.background = `linear-gradient(180deg, ${c.bg} 0%, ${c.bg2} 100%)`;
    // status bar contrast
    $("#statusbar").classList.toggle("on-dark", !!c.dark);
    // scene prop on main
    stage.querySelectorAll(".scene-emoji").forEach(e=>e.remove());
    if(c.prop){
      const e = document.createElement("div");
      e.className="scene-emoji"; e.textContent=c.prop;
      e.style.cssText += "font-size:96px;";
      if(id==="devotion"){ e.style.cssText="position:absolute;z-index:4;font-size:120px;top:8%;left:50%;transform:translateX(-50%)"; }
      else if(id==="hatching"){ e.style.cssText="position:absolute;z-index:4;font-size:120px;bottom:16%;left:50%;transform:translateX(-50%)"; }
      else if(id==="shhh"){ e.style.cssText="position:absolute;z-index:4;font-size:70px;top:24%;right:20%"; }
      else { e.style.cssText="position:absolute;z-index:1;font-size:150px;top:14%;left:50%;transform:translateX(-50%);opacity:.9"; }
      stage.insertBefore(e, charWrap);
    }
    charEl.classList.remove("bounce"); void charEl.offsetWidth; charEl.classList.add("bounce");
  }

  // ---- build sheet ----
  const sections = ["Action","Scene","Companion"];
  const scroll = $("#sheetScroll");
  sections.forEach(sec=>{
    const lbl = document.createElement("div"); lbl.className="section-label"; lbl.textContent=sec; scroll.appendChild(lbl);
    const row = document.createElement("div"); row.className="row"; row.dataset.sec=sec; scroll.appendChild(row);
  });
  function renderCards(){
    document.querySelectorAll(".row").forEach(r=>r.innerHTML="");
    CARDS.forEach(c=>{
      const row = document.querySelector(`.row[data-sec="${c.section}"]`);
      const card = document.createElement("div");
      card.className = "card" + (c.id===currentId ? (c.trophy?" trophy-sel":" selected") : "");
      card.dataset.id = c.id;
      card.innerHTML = `
        <div class="art" style="background:linear-gradient(180deg, ${c.bg} 0%, ${c.bg2} 100%)">
          ${c.prop? `<span class="prop" style="${c.propPos}">${c.prop}</span>`:""}
          <img src="${CHAR}" alt="${c.name}">
        </div>
        <div class="badge-ava" style="background-image:url(${FACE})"></div>
        ${c.trophy? `<div class="badge-trophy">🏆</div>`:""}
        ${!c.owned? `<div class="lock-overlay">
            <svg class="lk" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
            <span class="price">$${c.price}</span></div>`:""}
        <div class="name">${c.name}</div>`;
      card.addEventListener("click", ()=> onCardTap(c.id));
      row.appendChild(card);
    });
    updateStats();
  }
  function updateStats(){
    const owned = CARDS.filter(c=>c.owned).length;
    $("#statCards").textContent = `${owned}/${CARDS.length}`;
  }

  function onCardTap(id){
    const c = cardById(id);
    if(!c.owned){ openDialog(c); return; }
    applyScene(id);
    renderCards(); // refresh selection outlines
  }

  // ---- sheet open/close ----
  function openSheet(){ $("#scrim").classList.add("show"); $("#sheet").classList.add("show"); }
  function closeSheet(){ $("#scrim").classList.remove("show"); $("#sheet").classList.remove("show"); hideReactPop(); }
  $("#cardsBtn").addEventListener("click", openSheet);
  $("#closeSheet").addEventListener("click", closeSheet);
  $("#scrim").addEventListener("click", closeSheet);

  // ---- settings ----
  $("#settingsBtn").addEventListener("click", ()=> $("#settings").classList.add("show"));
  $("#backBtn").addEventListener("click", ()=> $("#settings").classList.remove("show"));

  const SET_ITEMS = [
    { emo:"🤩", label:"Rate Naiwa", chev:true },
    { emo:"📤", label:"Share with Friends", chev:true },
    { emo:"🤔", label:"FAQ", chev:true, hair:true },
    { emo:"🔄", label:"Restore Purchases", chev:true, hair:true },
    { emo:"🌐", label:"Language", val:"English", chev:true, hair:true },
    { emo:"🪞", label:"Horizontal Mirror", toggle:"mirror" },
    { emo:"☀️", label:"Keep Screen On", toggle:"awake", hair:true },
    { emo:"🔒", label:"Privacy Policy", chev:true, hair:true },
    { emo:"📄", label:"Terms of Use", chev:true },
  ];
  const setList = $("#setList");
  SET_ITEMS.forEach(it=>{
    const el = document.createElement("button");
    el.className = "item" + (it.hair?" hair":"");
    el.innerHTML = `<span class="emo">${it.emo}</span><span class="lbl">${it.label}</span>
      ${it.val? `<span class="val">${it.val}</span>`:""}
      ${it.toggle? `<span class="toggle" data-t="${it.toggle}"><span class="knob"></span></span>`
        : (it.chev? `<span class="chev"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>`:"")}`;
    el.addEventListener("click", ()=> onSettingTap(it, el));
    setList.appendChild(el);
  });

  let wakeLock = null;
  async function onSettingTap(it, el){
    if(it.toggle==="mirror"){
      mirror = !mirror;
      el.querySelector(".toggle").classList.toggle("on", mirror);
      charEl.classList.toggle("mirror", mirror);
      charEl.style.setProperty("--mx", mirror?-1:1);
      return;
    }
    if(it.toggle==="awake"){
      const on = !el.querySelector(".toggle").classList.contains("on");
      el.querySelector(".toggle").classList.toggle("on", on);
      try{
        if(on && "wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); }
        else if(wakeLock){ wakeLock.release(); wakeLock=null; }
      }catch(e){}
      toast(on? "Screen will stay on" : "Screen lock restored");
      return;
    }
    // other rows → little toast
    const msgs = {
      "Rate Naiwa":"Thanks for rating Naiwa! ⭐️",
      "Share with Friends":"Share sheet opened 📤",
      "FAQ":"Opening FAQ…",
      "Restore Purchases":"Purchases restored ✅",
      "Language":"Language: English 🌐",
      "Privacy Policy":"Opening Privacy Policy…",
      "Terms of Use":"Opening Terms of Use…",
    };
    toast(msgs[it.label] || it.label);
  }

  // ---- reactions ----
  const REACTS = ["😆","😍","👏","🔥","🥹","😮"];
  let reactCount = 15;
  const pop = $("#reactPop");
  REACTS.forEach(r=>{
    const b = document.createElement("button"); b.textContent=r;
    b.addEventListener("click", ()=>{ react(r); hideReactPop(); });
    pop.appendChild(b);
  });
  function openReactPop(){ pop.classList.add("show"); }
  function hideReactPop(){ pop.classList.remove("show"); }
  $("#reactionPill").addEventListener("click",(e)=>{ e.stopPropagation(); pop.classList.contains("show")?hideReactPop():openReactPop(); });
  document.addEventListener("click",(e)=>{ if(!pop.contains(e.target) && e.target.id!=="reactionPill") hideReactPop(); });
  function react(emoji){
    reactCount++; $("#reactCount").textContent = reactCount;
    $("#reactionPill").querySelector(".emo").textContent = emoji;
    // floating emoji over character
    const f = document.createElement("div"); f.className="float-emoji"; f.textContent=emoji;
    f.style.left = (40 + Math.random()*30) + "%"; f.style.bottom="34%";
    stage.appendChild(f); setTimeout(()=>f.remove(), 1200);
    charEl.classList.remove("bounce"); void charEl.offsetWidth; charEl.classList.add("bounce");
  }
  // tap the character to react
  charEl.addEventListener("click", ()=> react($("#reactionPill").querySelector(".emo").textContent));

  // ---- shuffle ----
  $("#shuffleBtn").addEventListener("click", ()=>{
    const owned = CARDS.filter(c=>c.owned && c.id!==currentId);
    if(!owned.length) return;
    const pick = owned[Math.floor(Math.random()*owned.length)];
    applyScene(pick.id); renderCards();
    if(!$("#sheet").classList.contains("show")) toast("✨ " + pick.name);
  });

  // ---- purchase dialog ----
  let pendingBuy = null;
  function openDialog(c){
    pendingBuy = c;
    $("#dlgTitle").textContent = c.name;
    $("#dlgText").textContent = `Unlock “${c.name}” to add this card to Reverie’s collection.`;
    $("#dlgBuy").textContent = `Buy $${c.price}`;
    $("#dlgPreview").querySelector("img").src = CHAR;
    $("#dlgPreview").style.background = `linear-gradient(180deg, ${c.bg}, ${c.bg2})`;
    $("#dlgScrim").classList.add("show");
  }
  $("#dlgCancel").addEventListener("click", ()=> $("#dlgScrim").classList.remove("show"));
  $("#dlgScrim").addEventListener("click",(e)=>{ if(e.target.id==="dlgScrim") $("#dlgScrim").classList.remove("show"); });
  $("#dlgBuy").addEventListener("click", ()=>{
    if(pendingBuy){ pendingBuy.owned = true; applyScene(pendingBuy.id); renderCards(); toast("Unlocked " + pendingBuy.name + " 🎉"); }
    $("#dlgScrim").classList.remove("show");
  });

  // ---- toast ----
  let toastT;
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }

  // ---- clock ----
  function tick(){
    const d = new Date();
    let h=d.getHours(), m=d.getMinutes();
    $("#clock").textContent = h + ":" + String(m).padStart(2,"0");
  }
  tick(); setInterval(tick, 10000);

  // ---- live battery (best effort) ----
  if(navigator.getBattery){
    navigator.getBattery().then(b=>{
      const upd=()=>{ const p=Math.round(b.level*100); document.querySelector(".batt .num").textContent=p; document.querySelector(".batt .lvl").style.width=Math.max(8,p)+"%"; document.querySelector(".batt .lvl").style.background = p<=20?"#f5c518":(p<=10?"#ff3b30":"#000"); };
      upd(); b.addEventListener("levelchange",upd);
    }).catch(()=>{});
  }

  // init
  renderCards();
  applyScene("glimpse");

  // deep links (?view=cards|settings, ?card=hatching)
  const q = new URLSearchParams(location.search);
  if(q.get("card")){ const c=cardById(q.get("card")); if(c&&c.owned) applyScene(c.id), renderCards(); }
  if(q.get("view")==="cards") openSheet();
  if(q.get("view")==="settings") $("#settings").classList.add("show");
})();
</script>
</body>
</html>
